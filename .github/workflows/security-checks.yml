name: Security checks

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all tracked security regressions and isolated build
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  # Exactly one authoritative automatic event creates the required job names.
  # Manual and scheduled work cannot cancel a branch push.
  group: security-${{ github.workflow }}-${{ github.repository_id }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and integration with current main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.event_name == 'push' && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$PUSH_BRANCH" != 'main' ]]; then
            [[ -n "$PUSH_BRANCH" ]]
            MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
            [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$MAIN_SHA" "$EXPECTED_SHA"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the curated offline suite sequentially
        run: node scripts/security-ci/run.mjs --core
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify locked solver packages and exercise real offline calculation
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m unittest discover -s tests -p 'test_dean_online.py' -v

  security-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and integration with current main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.event_name == 'push' && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$PUSH_BRANCH" != 'main' ]]; then
            [[ -n "$PUSH_BRANCH" ]]
            MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
            [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$MAIN_SHA" "$EXPECTED_SHA"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reject high or critical known dependency advisories
        run: node scripts/security-ci/audit.mjs
      - name: Reject reported advisories in pinned Python solver dependencies
        run: node scripts/security-ci/audit-python.mjs

  security-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and integration with current main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.event_name == 'push' && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$PUSH_BRANCH" != 'main' ]]; then
            [[ -n "$PUSH_BRANCH" ]]
            MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
            [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$MAIN_SHA" "$EXPECTED_SHA"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch the official pinned Gitleaks CLI and verify before extraction
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/xelay-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          chmod 0755 "$scanner_dir/gitleaks"
          printf '%s\n' "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan selected working files and all fetched history, with values withheld
        run: node scripts/security-ci/scan-secrets.mjs --gitleaks

  security-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full_suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and run all tracked security tests sequentially
        run: node scripts/security-ci/run.mjs --full --build

